# Read the Docs configuration — https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  commands:
    # Install uv so we can reuse the same docs dep group as local + CI.
    - asdf plugin add uv
    - asdf install uv latest
    - asdf global uv latest
    - uv sync --group docs --frozen
    - uv run mkdocs build --strict --site-dir "$READTHEDOCS_OUTPUT/html"
