site_name: supabase-orm
# Canonical URL. RTD auto-sets READTHEDOCS_CANONICAL_URL; the GH Pages
# workflow sets SITE_URL. Falls back to the RTD URL for local builds.
site_url: !ENV [READTHEDOCS_CANONICAL_URL, SITE_URL, "https://supabase-orm.readthedocs.io/"]
site_description: Lightweight async ORM on top of supabase-py with Pydantic validation.
repo_url: https://github.com/viperadnan-git/supabase-orm
repo_name: viperadnan-git/supabase-orm
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.footer
    - toc.integrate
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      use_pygments: true
      default_lang: python
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_signature_annotations: true
            separate_signature: true
            merge_init_into_class: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            filters:
              - "!^_"
              - "!^__init_subclass__$"
              - "!^__pydantic_init_subclass__$"

not_in_nav: |
  /404.md

nav:
  - Home: index.md
  - API reference:
      - Model: api/model.md
      - QueryBuilder: api/query.md
      - Relations & embeds: api/relations.md
      - Predicates: api/predicates.md
      - RPC: api/rpc.md
      - Client lifecycle: api/client.md
      - Debugging: api/debug.md
      - Exceptions: api/exceptions.md
