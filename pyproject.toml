[project]
name = "supabase-orm"
description = "Lightweight async ORM on top of supabase-py with Pydantic validation."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Adnan Ahmad", email = "viperadnan@gmail.com" }]
license = { text = "Apache-2.0" }
dynamic = ["version"]
keywords = ["supabase", "postgrest", "orm", "pydantic", "async", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.13.4",
    "supabase>=2.30.0",
]

[project.urls]
Homepage = "https://github.com/viperadnan-git/supabase-orm"
Repository = "https://github.com/viperadnan-git/supabase-orm"
Issues = "https://github.com/viperadnan-git/supabase-orm/issues"
Documentation = "https://viperadnan-git.github.io/supabase-orm/"

[build-system]
requires = ["hatchling", "hatch-vcs", "unasync>=0.6"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/supabase_orm/_version.py"

[tool.hatch.build.hooks.custom]
path = "scripts/hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/supabase_orm"]

[tool.nizm.hooks]
gen_sync = { cmd = "uv run python scripts/gen_sync.py", glob = "**/_async/**/*.py", outputs = ["**/_sync/**/*.py"] }
ruff = { cmd = "uvx ruff check --fix {staged_files} && uvx ruff format {staged_files}", glob = "*.py" }

[tool.ruff.lint]
select = ["F", "I"]
fixable = ["F401", "I"]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "python-dotenv>=1.0.0",
    "unasync>=0.6.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Share one event loop across the whole session — the integration suite's
# AsyncClient is session-scoped, so per-test loops would close it mid-run.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: tests that hit a real Supabase project (require SUPABASE_TEST_URL + SUPABASE_TEST_KEY).",
]
# Treat any warning we don't explicitly silence as an error, so regressions
# in our own code surface immediately. Third-party deprecations we can't
# fix from here are filtered through.
filterwarnings = [
    "error",
    # supabase-py 2.x emits these when constructing its sub-clients; they
    # come from inside the library, not from our call sites.
    "ignore:The 'timeout' parameter is deprecated.*:DeprecationWarning",
    "ignore:The 'verify' parameter is deprecated.*:DeprecationWarning",
]
